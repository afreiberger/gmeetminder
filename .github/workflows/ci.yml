name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GJS + GLib schema tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin

      - name: Compile GSettings schema
        run: make schemas

      - name: Run unit tests
        run: make test

  lint:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLib schema tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin

      - name: Validate GSettings schema (strict)
        run: |
          glib-compile-schemas --strict --dry-run \
            gmeetminder@afreiberger.github.io/schemas
